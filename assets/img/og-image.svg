<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F3F2ED"/>
  
  <!-- Subtle border grid -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="#111713" stroke-width="2"/>
  <line x1="80" y1="550" x2="1120" y2="550" stroke="#111713" stroke-width="2"/>
  <line x1="80" y1="80" x2="80" y2="550" stroke="#111713" stroke-width="2"/>
  <line x1="1120" y1="80" x2="1120" y2="550" stroke="#111713" stroke-width="2"/>
  
  <!-- Eyebrow -->
  <text x="140" y="160" font-family="ui-monospace, SFMono-Regular, monospace" font-size="20" font-weight="bold" fill="#505950" letter-spacing="2">DATA ENGINEERING CONSULTING</text>
  
  <!-- H1 Headline -->
  <text x="140" y="270" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="bold" fill="#111713" letter-spacing="-2">Ship <tspan fill="#111713">reliable</tspan> data faster.</text>
  <rect x="300" y="200" width="280" height="85" fill="#D7FF3F" style="mix-blend-mode: multiply;"/>

  <!-- Subheading -->
  <text x="140" y="370" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#111713">Consulting services and software for validation and reconciliation.</text>
  <text x="140" y="415" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#505950">A particular focus on financial services and high-stakes data environments.</text>
  
  <!-- Brand logo bottom -->
  <rect x="140" y="475" width="220" height="44" fill="#111713"/>
  <text x="160" y="505" font-family="ui-monospace, SFMono-Regular, monospace" font-size="20" font-weight="bold" fill="#FFFFFF" letter-spacing="1">ShipDataFast</text>
  <text x="390" y="505" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" fill="#505950">shipdatafast.com</text>
</svg>
